<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tarsi Review</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F6B4F">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tarsi Review">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --g:#0F6B4F;--gd:#094A37;--gl:#188462;--gx:#E6F3EC;
  --a:#F2B233;--ad:#C98A12;--al:#FFF1CF;
  --c:#FFF7E6;--bg:#F6F1E7;--ink:#1D2A24;--mut:#6E7A73;--line:#E4DCCB;
  --red:#E0533D;--redd:#B23A27;--redl:#FDE7E2;--lock:#D9D2C3;--lockd:#B9B09E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700;overscroll-behavior:none}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;background:var(--bg)}
h1,h2,h3,.fd{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:0}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* 3D pressable buttons */
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 16px;font:900 17px Nunito,sans-serif;letter-spacing:.6px;text-transform:uppercase;
  background:var(--g);color:#fff;box-shadow:0 5px 0 var(--gd);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gd)}
.btn.amber{background:var(--a);color:var(--gd);box-shadow:0 5px 0 var(--ad)}
.btn.amber:active{box-shadow:0 1px 0 var(--ad)}
.btn.red{background:var(--red);box-shadow:0 5px 0 var(--redd)}
.btn.ghost{background:#fff;color:var(--g);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{background:var(--lock);color:#fff;box-shadow:0 5px 0 var(--lockd);cursor:default;transform:none}

/* mascot */
.tarsi{display:block;margin:0 auto;filter:drop-shadow(0 10px 8px rgba(0,0,0,.12))}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:16px;line-height:1.35;box-shadow:0 3px 0 var(--line)}
.bubble.down::after{content:"";position:absolute;left:50%;bottom:-11px;width:18px;height:18px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.bubble.left::after{content:"";position:absolute;left:-11px;top:24px;width:18px;height:18px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}

/* ONBOARDING */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:28px 20px 24px}
.ob .grow{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px}
.choice{display:flex;align-items:center;gap:14px;width:100%;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:8px 0;
  font:800 17px Nunito;color:var(--ink);box-shadow:0 4px 0 var(--line);text-align:left}
.choice small{display:block;color:var(--mut);font-weight:700;font-size:13px}
.choice .ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--al);display:grid;place-items:center;font:700 15px Fredoka;color:var(--gd)}
.choice.sel{border-color:var(--g);background:var(--gx);box-shadow:0 4px 0 var(--g)}
.choice.sel .ic{background:var(--g);color:#fff}
.obbar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px}
.obbar i{display:block;height:100%;background:var(--a);border-radius:9px;transition:width .4s}

/* TOP BAR */
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:6px;font:700 18px Fredoka}
.stat svg{width:26px;height:26px}
.ring{width:34px;height:34px;transform:rotate(-90deg)}
.brandmini{display:flex;align-items:center;gap:6px;font:700 19px Fredoka;color:var(--g)}
.brandmini img{width:34px;height:34px;object-fit:contain}
.brandmini b{color:var(--ad);font-weight:700}

/* HOME / PATH */
.page{padding:0 16px 110px}
.unit{margin:26px 0 6px;border-radius:18px;padding:16px 18px;color:#fff;background:var(--uc,#0F6B4F);box-shadow:0 5px 0 var(--ucd,#094A37);display:flex;justify-content:space-between;align-items:center;gap:10px}
.unit.locked{background:var(--lockd);box-shadow:0 5px 0 #9c937f}
.unit small{display:block;opacity:.85;font:800 13px Nunito;text-transform:uppercase;letter-spacing:.8px}
.unit h2{font-size:22px}
.unit .tag{font:900 12px Nunito;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:99px;white-space:nowrap}
.path{position:relative;height:auto;padding:48px 0 8px}
.node-row{display:flex;justify-content:center;height:104px;position:relative}
.node{position:relative;width:76px;height:70px;border:0;border-radius:50%;background:var(--uc,#0F6B4F);box-shadow:0 8px 0 var(--ucd,#094A37);display:grid;place-items:center;transition:transform .06s,box-shadow .06s}
.node:active{transform:translateY(6px);box-shadow:0 2px 0 var(--ucd,#094A37)}
.node svg{width:34px;height:34px}
.node.done{background:var(--a);box-shadow:0 8px 0 var(--ad)}
.node.locked{background:var(--lock);box-shadow:0 8px 0 var(--lockd)}
.node.exam{border-radius:22px;width:84px}
.node.cur::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:5px solid rgba(255,255,255,.9);box-shadow:0 0 0 3px var(--uc,#0F6B4F);animation:pulse 1.6s infinite}
.node.exam.cur::before{border-radius:28px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.start-tip{position:absolute;top:-44px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid var(--line);color:var(--uc,#0F6B4F);font:900 14px Nunito;padding:7px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;z-index:2}
.start-tip::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.side-tarsi{position:absolute;width:118px;pointer-events:none}
.home-hello{display:flex;align-items:flex-end;gap:10px;margin-top:16px}
.home-hello img{width:96px;flex:none}
.home-hello .bubble{margin-bottom:34px}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:2px solid var(--line);display:flex;z-index:30;padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;border:0;background:none;padding:6px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 12px Nunito;color:var(--mut)}
.nav button svg{width:28px;height:28px}
.nav button.on{color:var(--g);background:var(--gx);box-shadow:inset 0 0 0 2px #bfe0cf}

/* LESSON */
.lesson{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px;padding:16px}
.xbtn{border:0;background:none;padding:4px;color:var(--mut)}
.xbtn svg{width:28px;height:28px}
.lbar{flex:1;height:18px;background:var(--line);border-radius:99px;overflow:hidden}
.lbar i{display:block;height:100%;background:var(--a);border-radius:99px;transition:width .35s;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.timer{font:700 16px Fredoka;background:var(--ink);color:#fff;padding:4px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.timer.low{background:var(--red)}
.combo{font:900 13px Nunito;color:var(--ad);text-transform:uppercase;letter-spacing:.6px;min-height:18px;padding:0 16px}
.lbody{flex:1;padding:4px 16px 16px}
.qrow{display:flex;gap:10px;align-items:flex-start;margin:6px 0 16px}
.qrow img{width:78px;flex:none}
.qrow .bubble{font-size:17px;font-weight:800;flex:1}
.topic{font:900 12px Nunito;color:var(--mut);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;
  font:800 17px Nunito;color:var(--ink);box-shadow:0 4px 0 var(--line);transition:transform .06s}
.opt:active{transform:translateY(2px)}
.opt b{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--mut)}
.opt.sel{border-color:var(--g);background:var(--gx);box-shadow:0 4px 0 var(--g)}
.opt.sel b{border-color:var(--g);color:var(--g)}
.opt.right{border-color:var(--g);background:var(--gx);box-shadow:0 4px 0 var(--g)}
.opt.wrong{border-color:var(--red);background:var(--redl);box-shadow:0 4px 0 var(--red)}
.opt[disabled]{cursor:default}
.lfoot{position:sticky;bottom:0;z-index:5;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:2px solid var(--line);background:var(--bg)}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));z-index:40;animation:up .25s ease-out}
@keyframes up{from{transform:translate(-50%,100%)}to{transform:translate(-50%,0)}}
.sheet.ok{background:#DDF1E5}.sheet.no{background:var(--redl)}
.sheet .row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.sheet img{width:74px;flex:none}
.sheet h3{font-size:24px}
.sheet.ok h3{color:var(--g)}.sheet.no h3{color:var(--redd)}
.sheet .exp{font-size:15px;line-height:1.45;color:var(--ink);background:rgba(255,255,255,.65);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-weight:700}

.passage{background:#fff;border:2px solid var(--line);border-radius:16px;margin:4px 0 14px;overflow:hidden}
.passage summary{list-style:none;cursor:pointer;padding:11px 14px;font:900 13px Nunito;text-transform:uppercase;letter-spacing:.6px;color:#5A3D8A;background:#F1EBFA;display:flex;justify-content:space-between}
.passage summary::-webkit-details-marker{display:none}
.passage summary::after{content:"▾"}.passage[open] summary::after{content:"▴"}
.passage .ptext{padding:12px 14px;font-size:15px;line-height:1.6;font-weight:600;white-space:pre-line;max-height:32vh;overflow:auto}
.passage h4{margin:0 0 6px;font:700 17px Fredoka}
.xcard{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 4px 0 var(--line);width:100%;text-align:left;font:inherit;color:inherit}
.xcard .dot{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.xcard .dot svg{width:26px;height:26px}
.xcard b{display:block;font:700 18px Fredoka}.xcard small{color:var(--mut)}
.xcard .best{margin-left:auto;font:700 15px Fredoka;color:var(--ad);white-space:nowrap}
textarea.code{width:100%;min-height:80px;border:2px solid var(--line);border-radius:12px;padding:10px;font:600 12px monospace;background:#fff;resize:vertical}
.node.pro{background:#fff;box-shadow:0 8px 0 var(--line);border:3px solid var(--a)}
.chip{font:900 11px Nunito;letter-spacing:.8px;padding:4px 8px;border-radius:8px;border:0}
.chip.pro{background:var(--a);color:var(--gd)}.chip.free{background:var(--line);color:var(--mut);cursor:pointer}
.wm{text-align:center;font-size:11px;color:#B9B09E;padding:6px 0 0;letter-spacing:.3px}
.field{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font:800 16px Nunito;margin:6px 0;background:#fff;color:var(--ink)}
.field:focus{outline:none;border-color:var(--g)}
.plist{text-align:left;margin:10px 0 16px;line-height:1.8;font-size:15px}
a.btn{text-decoration:none;text-align:center}
/* RESULT */
.center{text-align:center}
.res{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:28px 20px}
.res .grow{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px}
.cards{display:flex;gap:10px;width:100%}
.card3{flex:1;border-radius:16px;border:2px solid var(--a);overflow:hidden;text-align:center;background:#fff}
.card3 small{display:block;background:var(--a);color:var(--gd);font:900 12px Nunito;text-transform:uppercase;padding:5px}
.card3 div{font:700 24px Fredoka;padding:10px 4px;display:flex;justify-content:center;align-items:center;gap:6px}
.card3.g{border-color:var(--g)}.card3.g small{background:var(--g);color:#fff}
.card3.b{border-color:#4A90C2}.card3.b small{background:#4A90C2;color:#fff}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:12px;height:12px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* REVIEW list */
.rev{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.rev .tg{font:900 12px Nunito;padding:3px 9px;border-radius:99px;color:#fff;text-transform:uppercase}
.rev .ok{background:var(--g)}.rev .no{background:var(--red)}
.rev .exp{background:var(--bg);border-radius:10px;padding:9px 11px;margin-top:8px;font-size:14px;line-height:1.45}
.mut{color:var(--mut)}

/* PRACTICE / PROFILE */
.hcard{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 4px 0 var(--line)}
.hero-exam{background:var(--g);color:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 0 var(--gd);display:flex;gap:10px;align-items:center;margin-top:16px}
.hero-exam img{width:110px;flex:none;margin:-10px -6px -18px 0}
.hero-exam p{margin:6px 0 12px;opacity:.9;font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.mini svg{width:30px;height:30px;flex:none}
.mini b{display:block;font:700 22px Fredoka}
.mini small{color:var(--mut);font-size:13px}
.tbar{margin:10px 0}
.tbar .l{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.tbar .t{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.tbar .t i{display:block;height:100%;background:var(--g);border-radius:99px}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week i{display:block;width:100%;background:var(--a);border-radius:8px 8px 4px 4px;min-height:4px}
.week i.today{background:var(--g)}
.week span{font-size:11px;color:var(--mut)}
.prof{display:flex;align-items:center;gap:14px;margin-top:16px}
.prof .av{width:76px;height:76px;border-radius:50%;background:var(--g);display:grid;place-items:center;overflow:hidden;border:3px solid var(--a)}
.prof .av img{width:92px;margin-top:22px}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
.sw{width:52px;height:30px;border-radius:99px;background:var(--lock);border:0;position:relative}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--g)}.sw.on::after{left:25px}
.legal{font-size:12px;color:var(--mut);text-align:center;margin:18px 0 0;line-height:1.5}
.modal{position:fixed;inset:0;background:rgba(29,42,36,.5);z-index:70;display:grid;place-items:center;padding:20px}
.modal .box{background:var(--bg);border-radius:22px;padding:20px;max-width:380px;width:100%;text-align:center}
.modal img{width:110px}
</style>
</head>

P1:{title:"The Philippine Tarsier",lang:"English",text:`The Philippine tarsier is one of the smallest primates in the world. An adult can fit in the palm of a hand, yet each of its eyes is about as large as its brain. Because its eyes cannot move in their sockets, the tarsier turns its head instead, rotating it almost 180 degrees to look behind it.

Tarsiers are nocturnal. They sleep during the day, clinging to tree trunks, and hunt insects at night. They are also very sensitive. Loud noises, camera flashes, and being touched can stress them easily.

For this reason, sanctuaries in Bohol ask visitors to keep quiet and avoid using flash. Protecting the tarsier, these sanctuaries say, means respecting it from a distance.`},
P2:{title:"A Better Way to Study",lang:"English",text:`Many students study by reading their notes again and again the night before a test. It feels productive, but research on memory suggests a better way.

The first idea is spacing. Instead of studying for three hours in one night, a student can study the same material for thirty minutes on six different days. Short sessions spread over time give the brain repeated chances to strengthen a memory.

The second idea is retrieval practice. Rather than rereading, students close the book and try to recall the information, for example by answering practice questions. Struggling to remember is not a sign of failure; it is the very effort that makes learning stick.

Cramming may help a student pass tomorrow's quiz, but the information is often forgotten within days. Spacing and retrieval, on the other hand, build knowledge that lasts until the real exam.`},
P3:{title:"The Handkerchief",lang:"English",text:`The jeepney was already full when Paolo climbed in, soaked from the rain. He squeezed into the last seat and opened his reviewer, trying to protect its pages with his arm.

Across from him, an old woman watched him read. After a few stops, she tapped his knee. "Entrance exam?" she asked. Paolo nodded, embarrassed by his wet hair and wrinkled papers.

"My son took that exam twenty years ago," she said. "He also reviewed on jeepneys. Now he teaches in the same university." She smiled and handed him a dry handkerchief.

Paolo wiped his reviewer carefully, then his face. When the woman got off at the next corner, he realized he had not even asked her name. He looked down at the handkerchief and, for the first time that week, felt that the exam was not a wall in front of him but a door.`},
P4:{title:"Ang Bayanihan",lang:"Filipino",text:`Noong unang panahon, kapag lilipat ng tirahan ang isang pamilya sa probinsya, hindi na nila kailangang magbuhat ng gamit isa-isa. Binubuhat ng mga kapitbahay ang buong bahay-kubo, gamit ang mahahabang kawayan na nakapasan sa kanilang mga balikat. Walang bayad ang tulong na ito; kapalit lamang ang isang simpleng salu-salo pagkatapos.

Ang tawag dito ay bayanihan, mula sa salitang "bayani." Ipinapakita nito na ang bawat tao ay maaaring maging bayani sa maliit na paraan.

Ngayon, bihira na ang pagbubuhat ng bahay, ngunit buhay pa rin ang diwa ng bayanihan. Makikita ito kapag nagtutulungan ang magkakapitbahay tuwing may baha, o kapag nag-aambagan ang isang komunidad para sa isang maysakit.`},
P5:{title:"Handa Bago ang Bagyo",lang:"Filipino",text:`Taun-taon, humigit-kumulang dalawampung bagyo ang pumapasok sa Philippine Area of Responsibility. Dahil dito, mahalagang handa ang bawat pamilya bago pa man dumating ang sama ng panahon.

Isa sa pinakamabisang paghahanda ang "go bag." Ito ay isang bag na naglalaman ng tubig, pagkaing hindi madaling masira, flashlight, gamot, kopya ng mahahalagang dokumento, at power bank. Dapat nakalagay ito sa lugar na madaling abutin upang madala agad kung kailangang lumikas.

Mahalaga ring makinig sa mga abiso ng PAGASA at ng lokal na pamahalaan. Kapag sinabing lumikas, huwag nang hintaying tumaas ang tubig. Ang mga gamit ay mapapalitan, ngunit ang buhay ay hindi.`},
P6:{title:"The Sachet Problem",lang:"English",text:`Walk into any sari-sari store and you will see strips of sachets hanging by the door: shampoo, coffee, detergent, all in single-use packets. Sachets make products affordable for families who cannot buy a full bottle. But they come at a cost.

Most sachets are made of several layers of plastic and foil stuck together, which makes them very hard to recycle. Many end up in canals and rivers, where they block drainage and worsen flooding during heavy rain.

Some argue that banning sachets would hurt low-income families the most. This concern is fair. A better solution is refill stations, where customers bring their own containers and buy only the amount they need, at a similar price. Several communities have already tried this. If manufacturers and local governments support such programs, affordability and a cleaner environment do not have to be enemies.`}

r4c:{p:"P4",t:"Detalye",q:"Saang salita nagmula ang 'bayanihan' ayon sa teksto?",o:["bayani","bayan","bahay","bayad"],e:"'Ang tawag dito ay bayanihan, mula sa salitang bayani.'"},
r4d:{p:"P4",t:"Detalye",q:"Alin ang halimbawa ng bayanihan sa kasalukuyan ayon sa teksto?",o:["Pagtutulungan ng magkakapitbahay tuwing may baha","Pagbili ng bagong bahay","Paglipat sa lungsod","Pagbabayad ng buwis"],e:"Binanggit sa huling talata ang pagtutulungan tuwing may baha at ambagan para sa maysakit."},
r4e:{p:"P4",t:"Talasalitaan",q:"Ano ang kahulugan ng 'nakapasan' sa teksto?",o:["nakapatong sa balikat","nakatali sa lupa","nakasabit sa bubong","nakahiga sa sahig"],e:"Context clue: 'kawayan na nakapasan sa kanilang mga balikat.' Ang pasan ay dalang nakapatong sa balikat."},
r5a:{p:"P5",t:"Layunin",q:"Ano ang layunin ng teksto?",o:["Magbigay ng impormasyon at payo tungkol sa paghahanda sa bagyo","Magkuwento tungkol sa isang pamilyang nasalanta","Magbenta ng go bag","Ipaliwanag kung paano nabubuo ang bagyo"],e:"Nagbibigay ito ng datos (20 bagyo) at mga payo (go bag, makinig sa abiso, lumikas). Walang kuwento o pagbebenta."},
r5b:{p:"P5",t:"Detalye",q:"Ilang bagyo ang karaniwang pumapasok sa PAR bawat taon ayon sa teksto?",o:["Humigit-kumulang 20","Humigit-kumulang 5","Humigit-kumulang 50","Eksaktong 12"],e:"'Taun-taon, humigit-kumulang dalawampung bagyo ang pumapasok...'"},
r5c:{p:"P5",t:"Detalye",q:"Alin ang HINDI binanggit na laman ng go bag?",o:["Telebisyon","Flashlight","Gamot","Power bank"],e:"Ang listahan: tubig, pagkain, flashlight, gamot, dokumento, power bank. Walang telebisyon."},
r5d:{p:"P5",t:"Hinuha",q:"Bakit dapat nasa lugar na madaling abutin ang go bag?",o:["Para madala agad kung kailangang lumikas","Para hindi ito mabasa","Para makita ng mga bisita","Para hindi makalimutang bilhin"],e:"'...upang madala agad kung kailangang lumikas.'"},
r5e:{p:"P5",t:"Hinuha",q:"Ano ang ibig sabihin ng 'Ang mga gamit ay mapapalitan, ngunit ang buhay ay hindi'?",o:["Mas mahalaga ang kaligtasan kaysa sa mga ari-arian.","Dapat bumili ng maraming gamit bago ang bagyo.","Madaling bumili ng bagong bahay.","Huwag nang dalhin ang go bag."],e:"Hinihikayat nito ang paglikas agad: kahit maiwan ang gamit, buhay ang pinakamahalaga."},
r6a:{p:"P6",t:"Main Claim",q:"What is the author's main claim?",o:["Refill stations can keep products affordable while reducing sachet waste.","Sachets should be banned immediately.","Sari-sari stores are the main cause of flooding.","Families should only buy full bottles."],e:"Tinanggap ng author ang problema ng ban, at nag-alok ng refill stations bilang mas magandang solusyon. Iyon ang main claim."},
r6b:{p:"P6",t:"Details",q:"Why are sachets hard to recycle, according to the passage?",o:["They are made of layers of plastic and foil stuck together.","They are too small to see.","They dissolve in water.","Stores refuse to collect them."],e:"'Most sachets are made of several layers of plastic and foil stuck together, which makes them very hard to recycle.'"},
r6c:{p:"P6",t:"Counterargument",q:"Which opposing view does the author call 'fair'?",o:["A ban could hurt low-income families.","Sachets are easy to recycle.","Refill stations are too expensive.","Flooding is not caused by plastic."],e:"'Some argue that banning sachets would hurt low-income families the most. This concern is fair.'"},
r6d:{p:"P6",t:"Vocabulary",q:"'Affordability and a cleaner environment do not have to be enemies' means they...",o:["can exist together","are always in conflict","are not important","mean the same thing"],e:"Ang 'not enemies' ay hindi magkalaban, kaya puwedeng magkasabay ang mura at malinis."},
r6e:{p:"P6",t:"Tone",q:"The tone of the passage is best described as:",o:["concerned but solution-oriented","angry and hopeless","humorous and playful","neutral and uninterested"],e:"Seryoso ang pag-aalala ng author sa problema pero nag-aalok ng solusyon, kaya concerned at solution-oriented."},

/* ================= LANGUAGE ================= */
l1:{t:"Subject-Verb Agreement",q:"Each of the students ___ a calculator.",o:["has","have","are having","were having"],e:"Ang 'each' ay singular, kaya singular verb: has. Huwag madaya ng 'students'."},
l2:{t:"Subject-Verb Agreement",q:"Neither the teacher nor the students ___ ready.",o:["are","is","was","has been"],e:"Sa neither...nor, sinusunod ng verb ang pinakamalapit na subject. Plural ang 'students', kaya are."},
l3:{t:"Subject-Verb Agreement",q:"The news ___ surprising.",o:["was","were","are","have been"],e:"Kahit may -s, singular ang 'news', kaya was."},
l4:{t:"Subject-Verb Agreement",q:"Mathematics ___ my favorite subject.",o:["is","are","were","have"],e:"Pangalan ng isang subject ang Mathematics, kaya singular: is."},
l5:{t:"Subject-Verb Agreement",q:"One of my friends ___ from Cebu.",o:["is","are","were","be"],e:"Ang subject ay 'one' (singular), hindi 'friends'. Kaya is."},
v1:{t:"Verb Tenses",q:"By next year, she ___ from college.",o:["will have graduated","has graduated","graduated","will graduating"],e:"'By next year' ay tumutukoy sa aksyong tapos na bago ang isang punto sa hinaharap, kaya future perfect: will have graduated."},
v2:{t:"Verb Tenses",q:"If I ___ you, I would study tonight.",o:["were","am","was being","will be"],e:"Sa hypothetical na 'if' (hindi totoo), ginagamit ang 'were' para sa lahat ng subject: If I were you."},
v3:{t:"Verb Tenses",q:"He ___ to school every day.",o:["walks","walk","walking","have walked"],e:"Habitual action ('every day') at singular subject (he), kaya simple present na may -s: walks."},
v4:{t:"Verb Tenses",q:"They ___ dinner when the lights went out.",o:["were eating","ate","are eating","have eaten"],e:"Past progressive ang aksyong nagaganap nang may biglang nangyari: were eating ... when ... went out."},
v5:{t:"Verb Forms",q:"Ano ang past participle ng 'write'?",o:["written","wrote","writed","writing"],e:"write (present) → wrote (past) → written (past participle). Hal: I have written."},
w1v:{t:"Vocabulary",q:"Meticulous means:",o:["very careful about details","very fast","careless","lazy"],e:"Ang meticulous ay maingat sa bawat detalye. Kasalungat: careless."},
w2v:{t:"Vocabulary",q:"Abundant means:",o:["plentiful","rare","empty","tiny"],e:"Abundant = sagana, marami. Kasalungat: scarce o rare."},
w3v:{t:"Vocabulary",q:"Reluctant means:",o:["unwilling","eager","angry","proud"],e:"Reluctant = ayaw o nag-aatubili. Kasalungat ang eager (sabik)."},
w4v:{t:"Vocabulary",q:"Candid means:",o:["honest and direct","shy","sweet","secretive"],e:"Candid = tapat at prangka magsalita."},
w5v:{t:"Vocabulary",q:"Diligent means:",o:["hardworking","forgetful","rude","sleepy"],e:"Diligent = masipag at matiyaga."},
x1v:{t:"Antonyms",q:"Ano ang antonym ng 'ancient'?",o:["modern","old","historic","broken"],e:"Ancient = napakaluma. Kabaligtaran: modern."},
x2v:{t:"Antonyms",q:"Ano ang antonym ng 'generous'?",o:["stingy","kind","rich","giving"],e:"Generous = mapagbigay. Kabaligtaran: stingy (kuripot)."},
x3v:{t:"Context Clues",q:"'The speaker's voice was so feeble that people at the back could not hear him.' Feeble means:",o:["weak","loud","angry","clear"],e:"Context clue: hindi siya marinig sa likod, kaya mahina (weak) ang boses niya."},
x4v:{t:"Context Clues",q:"'After hours of hiking, the exhausted climbers finally rested.' Exhausted means:",o:["very tired","excited","lost","hungry"],e:"Ilang oras silang nag-hike at nagpahinga pagkatapos, kaya pagod na pagod (very tired)."},
x5v:{t:"Analogy",q:"Pen is to writer as brush is to ___.",o:["painter","paint","canvas","color"],e:"Relationship: tool → taong gumagamit. Pen → writer, brush → painter."},
u1:{t:"Grammar",q:"Alin ang tamang pangungusap?",o:["She and I went to the market.","Her and me went to the market.","Me and her went to the market.","She and me went to the market."],e:"Subject ng pangungusap, kaya subject pronouns: She at I. Subukan isa-isa: 'I went' (tama), 'me went' (mali)."},
u2:{t:"Grammar",q:"Between you and ___, I think the test was easy.",o:["me","I","myself","mine"],e:"Ang 'between' ay preposition, kaya object pronoun ang kasunod: between you and me."},
u3:{t:"Grammar",q:"___ going to the mall later.",o:["They're","Their","There","Theyre"],e:"They're = they are. 'They are going...' Tama. Ang 'their' ay possessive; ang 'there' ay lugar."},
u4:{t:"Grammar",q:"She is good ___ math.",o:["at","in","on","with"],e:"Ang tamang collocation ay 'good at' para sa skill o subject."},
u5:{t:"Grammar",q:"We waited for ___ hour.",o:["an","a","many","few"],e:"Silent ang 'h' sa hour, kaya vowel sound ang simula: an hour."},
fp1:{t:"Bahagi ng Pananalita",q:"Alin ang pandiwa sa pangungusap: 'Mabilis na tumakbo ang bata.'",o:["tumakbo","mabilis","bata","ang"],e:"Pandiwa ang salitang nagsasaad ng kilos: tumakbo. Ang 'mabilis' ay naglalarawan kung paano tumakbo."},
fp2:{t:"Bahagi ng Pananalita",q:"Anong bahagi ng pananalita ang 'maganda'?",o:["Pang-uri","Pandiwa","Pang-abay","Pangngalan"],e:"Naglalarawan ito ng pangngalan (hal. magandang bulaklak), kaya pang-uri."},
fp3:{t:"Bahagi ng Pananalita",q:"Anong uri ng pangngalan ang 'Maynila'?",o:["Pantangi","Pambalana","Lansakan","Basal"],e:"Tiyak na pangalan ng lugar at nagsisimula sa malaking titik, kaya pantangi. Ang 'lungsod' ay pambalana."},
fp4:{t:"Bahagi ng Pananalita",q:"Anong uri ng panghalip ang 'kami'?",o:["Panao","Pamatlig","Pananong","Panaklaw"],e:"Pumapalit ito sa pangalan ng tao (kami, tayo, siya), kaya panghalip panao. Pamatlig ang 'ito, iyan, iyon'."},
fp5:{t:"Bahagi ng Pananalita",q:"Anong uri ng pang-abay ang 'kahapon'?",o:["Pamanahon","Panlunan","Pamaraan","Panggaano"],e:"Sinasagot nito ang 'kailan?', kaya pamanahon. Panlunan ang sumasagot sa 'saan?', pamaraan sa 'paano?'."},
k1:{t:"Wastong Gamit",q:"Tumakbo siya ___ mabilis.",o:["nang","ng","na","ang"],e:"Ginagamit ang 'nang' bilang pang-abay na naglalarawan kung paano ginawa ang pandiwa (tumakbo nang mabilis)."},
k2:{t:"Wastong Gamit",q:"Kumain ___ mangga si Lito.",o:["ng","nang","na","sa"],e:"Ginagamit ang 'ng' bago ang pangngalang layon ng pandiwa: kumain ng mangga."},
k3:{t:"Wastong Gamit",q:"Uuwi ___ siya bukas.",o:["raw","daw","rin","din"],e:"Kapag nagtatapos sa patinig ang salita bago nito (uuwi), 'raw' ang gamit. 'Daw' kapag katinig (hal. umalis daw)."},
k4:{t:"Wastong Gamit",q:"Alin ang wasto?",o:["Mayroon siyang bagong sapatos.","May siyang bagong sapatos.","May siya bagong sapatos.","Mayroon siya ng bagong sapatos."],e:"'Mayroon' ang gamit kapag panghalip (siya, sila, ka) ang kasunod. 'May' kapag pangngalan o pang-uri ang kasunod (May bagong sapatos siya)."},
k5:{t:"Wastong Gamit",q:"Hindi ko alam ___ saan siya pupunta.",o:["kung","kong","ng","nang"],e:"Ang 'kung' ay pangatnig (if/whether). Ang 'kong' ay 'ko' + pang-angkop (hal. ang aklat kong bago)."},
t1:{t:"Talasalitaan",q:"Kasingkahulugan ng 'masipag':",o:["masikap","tamad","mabagal","maingay"],e:"Masipag = masikap, mahilig magtrabaho. Kasalungat ang tamad."},
t2:{t:"Talasalitaan",q:"Kasalungat ng 'malinis':",o:["marumi","maayos","maganda","malinaw"],e:"Ang kabaligtaran ng malinis ay marumi."},
t3:{t:"Idyoma",q:"Ano ang ibig sabihin ng 'mabigat ang kamay'?",o:["tamad magtrabaho","madaling manakit","malakas","mapagbigay"],e:"Ang 'mabigat ang kamay' ay tamad. Huwag ipagkamali sa 'magaan ang kamay' na ibig sabihin ay madaling manakit."},
t4:{t:"Idyoma",q:"Ano ang ibig sabihin ng 'bukas-palad'?",o:["mapagbigay","kuripot","mayaman","malungkot"],e:"Ang taong bukas-palad ay laging handang magbigay o tumulong."},
t5:{t:"Idyoma",q:"Ano ang ibig sabihin ng 'nagbabanat ng buto'?",o:["nagtatrabaho nang masipag","nagkakasakit","nag-eehersisyo","natutulog"],e:"Ang 'magbanat ng buto' ay magtrabaho nang husto para kumita."},

const KEY="tarsi-review-v1";
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
let S=load();
function load(){let d=null;try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 return Object.assign({onboarded:false,exam:null,goal:20,xp:0,streak:0,last:null,done:{},xpByDay:{},topic:{},sound:true,best:{}},d||{})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function todayXP(){return S.xpByDay[today()]||0}
function streakAlive(){if(!S.last)return 0;const d=(new Date(today())-new Date(S.last))/864e5;return d<=1?S.streak:0}
function addXP(n){S.xp+=n;S.xpByDay[today()]=(S.xpByDay[today()]||0)+n;
 const t=today();if(S.last!==t){const gap=S.last?(new Date(t)-new Date(S.last))/864e5:99;S.streak=gap===1?S.streak+1:1;S.last=t}save()}

/* ---------- SOUND ---------- */
let AC;function beep(kind){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const seq=kind==="ok"?[[660,0],[880,.09]]:kind==="win"?[[523,0],[659,.1],[784,.2],[1047,.3]]:[[220,0],[180,.12]];
 seq.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==="no"?"sawtooth":"triangle";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.18);
  o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.2)})}catch(e){}}

function topbar(){const st=streakAlive();
 return `<div class="top"><div class="brandmini"><img src="${IMG.head}" alt="">Tarsi<b>Review</b></div>
 <div style="display:flex;gap:14px;align-items:center">

function confetti(){document.querySelectorAll(".confetti").forEach(x=>x.remove());const c=document.createElement("div");c.className="confetti";const cols=["#F2B233","#0F6B4F","#188462","#FFF7E6","#E0533D"];
 for(let i=0;i<60;i++){const p=document.createElement("i");p.style.left=Math.random()*100+"%";p.style.background=pick(cols);p.style.animationDuration=(1.6+Math.random()*1.6)+"s";p.style.animationDelay=Math.random()*.4+"s";c.appendChild(p)}

   if(li===2)html+=`<div style="position:relative;height:0"><img class="side-tarsi" src="${IMG.neutral}" style="left:4px;top:-200px" alt=""></div>`;

  });

 html+=`<p class="legal">Tarsi Review · Independent practice material.<br>Not affiliated with UP, Ateneo, DLSU, UST, or CSC.</p></div>`+navbar("home");app.innerHTML=html}

function findLesson(lid){if(lid===FULL_EXAM.id)return FULL_EXAM;for(const u of UNITS)for(const l of u.lessons)if(l.id===lid)return l}
function examSize(l){if(l.full){const m=l.mix;return m.math+m.sci+m.read*5+m.lang+m.gen}if(l.passages)return l.passages*5;return l.n}
function openLesson(lid,fromPractice){const l=findLesson(lid);if(!isPro()&&(l.exam||lessonState()[lid]==="pro"))return paywall(l);const st=fromPractice?"cur":lessonState()[lid];
 if(st==="locked"){modal(`${tarsi("sad",110)}<h2 style="margin:6px 0">Sandali lang!</h2><p class="mut">Tapusin muna ang naunang lesson para ma-unlock ang <b>${l.name}</b>.${l.exam?'<br>Puwede mo rin itong simulan sa <b>Mock Exam</b> tab.':''}</p><button class="btn" onclick="closeModal()">Sige</button>`);return}
 modal(`${tarsi("neutral",110,"pop")}<h2 style="margin:6px 0">${l.name}</h2><p class="mut">${l.exam?`${examSize(l)} tanong · ${l.mins} minuto · review sa dulo`:`${l.qs.length} tanong · may paliwanag bawat sagot`}</p>
  ${S.best[lid]!=null?`<p style="margin:0 0 10px">Best score: <b>${S.best[lid]}/${l.exam?examSize(l):l.qs.length}</b></p>`:''}
  <button class="btn ${l.exam?'amber':''}" onclick="closeModal();${l.exam?`startExam('${lid}')`:`startLesson('${lid}')`}">${S.done[lid]?"Ulitin":"Simulan"}</button>
  <button class="btn ghost" style="margin-top:12px" onclick="closeModal()">Mamaya na</button>`)}
function modal(inner){const m=document.createElement("div");m.className="modal";m.id="modal";m.innerHTML=`<div class="box pop">${inner}</div>`;m.onclick=e=>{if(e.target===m)closeModal()};document.body.appendChild(m)}
function closeModal(){const m=$("#modal");if(m)m.remove()}

/* ---------- LESSON (instant feedback) ---------- */
let pOpen={};function passageBox(q,open=true){if(!q.p)return "";if(pOpen[q.p]!=null)open=pOpen[q.p];const P=PASS[q.p];
 return `<details class="passage" ${open?'open':''} ontoggle="pOpen['${q.p}']=this.open"><summary>Basahin: ${P.lang}</summary><div class="ptext"><h4>${P.title}</h4>${P.text}</div></details>`}
let L;
function startLesson(lid){const l=findLesson(lid);pOpen={};
 L={lid,items:shuffle(l.qs).map(k=>({k,opts:shuffle(Q[k].o)})),i:0,sel:null,correct:0,combo:0,t0:Date.now(),retry:[]};renderQ()}
function renderQ(){const it=L.items[L.i],q=Q[it.k];
 const comboMsg=L.combo>=3?`🔥 ${L.combo} sunod-sunod na tama!`:"";
 app.innerHTML=`<div class="lesson"><div class="lhead"><button class="xbtn" onclick="quitLesson()">${IC.x}</button><div class="lbar"><i style="width:${L.i/L.items.length*100}%"></i></div></div>
  <div class="combo">${comboMsg}</div>
  <div class="lbody">${passageBox(q,L.i===0||Q[L.items[L.i-1].k].p!==q.p)}<div class="qrow">${tarsi("neutral",78)}<div style="flex:1"><div class="topic">${q.t}</div><div class="bubble left">${q.q}</div></div></div>
  <div id="opts">${it.opts.map((o,j)=>`<button class="opt ${L.sel===j?'sel':''}" onclick="L.sel=${j};renderQ()"><b>${j+1}</b>${o}</button>`).join("")}</div>${wm()}</div>
  <div class="lfoot"><button class="btn" ${L.sel==null?'disabled':''} onclick="checkQ()">I-check</button></div></div>`}
function checkQ(){const it=L.items[L.i],q=Q[it.k],ok=it.opts[L.sel]===q.o[0];
 S.topic[q.t]=S.topic[q.t]||{c:0,n:0};S.topic[q.t].n++;if(ok){S.topic[q.t].c++;L.correct++;L.combo++}else{L.combo=0;L.retry.push(it)}save();
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;b.onclick=null;if(it.opts[j]===q.o[0])b.classList.add("right");else if(j===L.sel)b.classList.add("wrong")});
 if(!ok)$("#opts").classList.add("shake");
 beep(ok?"ok":"no");
 const okLines=["Tama! 🎉","Galing mo!","Ayos, tama!","Pasado 'yan!"],noLines=["Ay, malapit na!","Oops, hindi 'yan.","Sayang!"];
 $(".lfoot").outerHTML=`<div class="sheet ${ok?'ok':'no'}"><div class="row">${tarsi(ok?"happy":"sad",74,"pop")}<div><h3>${pick(ok?okLines:noLines)}</h3>${ok?'':`<div style="font-size:15px;color:var(--redd)">Tamang sagot: <b>${q.o[0]}</b></div>`}</div></div>
   <div class="exp">${q.e}</div><button class="btn ${ok?'':'red'}" onclick="nextQ()">Ituloy</button></div>`}
function nextQ(){L.i++;L.sel=null;window.scrollTo(0,0);
 if(L.i>=L.items.length){if(L.retry.length&&!L.retried){L.retried=true;L.items=L.items.concat(L.retry.map(it=>({k:it.k,opts:shuffle(Q[it.k].o)})));L.retry=[];
   app.innerHTML=`<div class="res"><div class="grow center">${tarsi("neutral",170,"pop")}<div class="bubble" style="font-size:17px">Balikan natin ang mga namali mo.<br>Kaya mo 'yan! 💪</div></div><button class="btn" onclick="renderQ()">Ituloy</button></div>`;return}
  return finishLesson()}
 renderQ()}
function quitLesson(){modal(`${tarsi("sad",110)}<h2 style="margin:6px 0">Aalis ka na?</h2><p class="mut">Mawawala ang progress mo sa lesson na ito.</p><button class="btn" onclick="closeModal()">Ituloy ang aral</button><button class="btn ghost" style="margin-top:12px;color:var(--red)" onclick="closeModal();home()">Umalis</button>`)}
function finishLesson(){const l=findLesson(L.lid),first=l.qs.length,perfect=!L.retried;
 const xp=10+(perfect?5:0),secs=Math.round((Date.now()-L.t0)/1000);
 const firstTry=perfect?first:first-(L.items.length-first);
 S.done[L.lid]=true;S.best[L.lid]=Math.max(S.best[L.lid]||0,firstTry);addXP(xp);beep("win");confetti();
 app.innerHTML=`<div class="res"><div class="grow center">${tarsi("cheer",210,"pop bob")}
  <h1 style="font-size:30px;color:var(--ad)">${perfect?"Perfect lesson!":"Lesson complete!"}</h1>
  <div class="cards"><div class="card3"><small>XP</small><div>${IC.star.replace('<svg','<svg width="22"')}${xp}</div></div>
  <div class="card3 g"><small>Tama</small><div>${IC.target.replace('<svg','<svg width="22"')}${Math.round(firstTry/first*100)}%</div></div>
  <div class="card3 b"><small>Oras</small><div>${IC.bolt.replace('<svg','<svg width="22"')}${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}</div></div></div></div>
  <button class="btn" onclick="home()">Ituloy</button></div>`}

/* ---------- MOCK EXAM (timed, review at end) ---------- */
let E,tick;
function poolOf(uid){return UNITS.find(u=>u.id===uid).lessons.flatMap(l=>l.qs||[])}
function readingSet(n){const ps=shuffle(Object.keys(PASS)).slice(0,n);return ps.flatMap(p=>shuffle(Object.keys(Q).filter(k=>Q[k].p===p)))}
function buildExam(l){if(l.full){const m=l.mix;return [...shuffle(poolOf("math")).slice(0,m.math),...shuffle(poolOf("sci")).slice(0,m.sci),...readingSet(m.read),...shuffle(poolOf("lang")).slice(0,m.lang),...shuffle(poolOf("gen")).slice(0,m.gen)]}
 if(l.passages)return readingSet(l.passages);return shuffle(poolOf(unitOf(l.id).id)).slice(0,l.n)}
function startExam(lid){const l=findLesson(lid);clearInterval(tick);pOpen={};
 E={lid,items:buildExam(l).map(k=>({k,opts:shuffle(Q[k].o)})),i:0,ans:{},left:l.mins*60,lim:l.mins*60};
 tick=setInterval(()=>{E.left--;const t=$("#tm");if(t){t.textContent=fmt(E.left);t.classList.toggle("low",E.left<=120)}if(E.left<=0)endExam()},1000);renderE()}
const fmt=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
let lastEI=-1;function renderE(){const it=E.items[E.i],q=Q[it.k];if(lastEI!==E.i){window.scrollTo(0,0);lastEI=E.i}
 app.innerHTML=`<div class="lesson"><div class="lhead"><button class="xbtn" onclick="quitExam()">${IC.x}</button><div class="lbar"><i style="width:${(E.i+1)/E.items.length*100}%"></i></div><span id="tm" class="timer ${E.left<=120?'low':''}">${fmt(E.left)}</span></div>
  <div class="combo" style="color:var(--mut)">Tanong ${E.i+1} / ${E.items.length}</div>
  <div class="lbody">${passageBox(q,E.i===0||Q[E.items[E.i-1].k].p!==q.p)}<div class="topic">${q.t}</div><div class="bubble" style="font-size:17px;font-weight:800">${q.q}</div>
  <div>${it.opts.map((o,j)=>`<button class="opt ${E.ans[E.i]===j?'sel':''}" onclick="E.ans[E.i]=${j};renderE()"><b>${"ABCD"[j]}</b>${o}</button>`).join("")}</div>${wm()}</div>
  <div class="lfoot" style="display:flex;gap:10px"><button class="btn ghost" ${E.i===0?'disabled':''} onclick="E.i--;renderE()">Bumalik</button>
  <button class="btn ${E.i===E.items.length-1?'amber':''}" onclick="${E.i===E.items.length-1?'confirmEnd()':'E.i++;renderE()'}">${E.i===E.items.length-1?'Tapusin':'Susunod'}</button></div></div>`}
function confirmEnd(){const blank=E.items.length-Object.keys(E.ans).length;
 if(!blank)return endExam();
 modal(`${tarsi("sad",100)}<h2 style="margin:6px 0">May ${blank} blangko pa</h2><p class="mut">Sigurado ka bang tatapusin na?</p><button class="btn" onclick="closeModal()">Balikan</button><button class="btn ghost" style="margin-top:12px" onclick="closeModal();endExam()">Tapusin na</button>`)}
function quitExam(){modal(`${tarsi("sad",110)}<h2 style="margin:6px 0">Ihinto ang exam?</h2><p class="mut">Hindi mase-save ang sagot mo.</p><button class="btn" onclick="closeModal()">Ituloy</button><button class="btn ghost" style="margin-top:12px;color:var(--red)" onclick="closeModal();clearInterval(tick);home()">Ihinto</button>`)}
function endExam(){clearInterval(tick);if(!E||E.ended)return;E.ended=true;closeModal();let c=0;const miss={};
 E.items.forEach((it,i)=>{const q=Q[it.k],ok=E.ans[i]!=null&&it.opts[E.ans[i]]===q.o[0];S.topic[q.t]=S.topic[q.t]||{c:0,n:0};S.topic[q.t].n++;if(ok){c++;S.topic[q.t].c++}else miss[q.t]=(miss[q.t]||0)+1});
 const n=E.items.length,p=c/n,used=E.lim-Math.max(0,E.left);S.done[E.lid]=true;S.best[E.lid]=Math.max(S.best[E.lid]||0,c);addXP(c);
 const mood=p>=.75?"cheer":p>=.5?"neutral":"sad";if(p>=.75){beep("win");confetti()}
 const weak=Object.entries(miss).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
 app.innerHTML=`<div class="res" style="justify-content:flex-start"><div class="center" style="padding-top:10px">${tarsi(mood,170,"pop")}
  <h1 style="font-size:44px;color:var(--g);margin-top:6px">${c}/${n}</h1>
  <p style="margin:4px 0 14px;font-size:17px">${p>=.85?"Ang galing! Handa ka na. 🎉":p>=.65?"Malapit na! Konting review pa.":p>=.4?"Okay 'yan. Dito tayo matututo.":"Simula pa lang 'to. Basahin natin ang paliwanag. 💪"}</p>
  <div class="cards"><div class="card3"><small>XP</small><div>${IC.star.replace('<svg','<svg width="22"')}${c}</div></div><div class="card3 g"><small>Score</small><div>${Math.round(p*100)}%</div></div><div class="card3 b"><small>Oras</small><div>${fmt(used)}</div></div></div>
  ${weak.length?`<div class="bubble" style="margin-top:16px;text-align:left"><b>Payo ni Tarsi:</b> i-review ang ${weak.join(", ")}.</div>`:''}</div>
  <h2 style="margin:22px 0 4px">Review ng sagot</h2>
  ${E.items.map((it,i)=>{const q=Q[it.k],a=E.ans[i],ok=a!=null&&it.opts[a]===q.o[0];return `<div class="rev"><span class="tg ${ok?'ok':'no'}">${ok?'Tama':'Mali'}</span> <span class="mut" style="font-size:13px">#${i+1} · ${q.t}</span>
   <div style="margin-top:6px">${q.q}</div><div class="mut" style="font-size:14px">Sagot mo: ${a==null?'—':it.opts[a]} · Tama: <b style="color:var(--ink)">${q.o[0]}</b></div><div class="exp">${q.e}</div></div>`}).join("")}
  ${wm()}<div style="height:16px"></div><button class="btn" onclick="home()">Bumalik sa Aral</button><div style="height:20px"></div></div>`;window.scrollTo(0,0)}

 <p class="mut" style="font-size:14px;margin:0 0 8px">Ilagay ang pangalan at code na natanggap mo pagkatapos bumili. Dapat eksaktong pareho ang pangalan.</p>
 <input class="field" id="lnm" placeholder="Pangalan (hal. Juan Dela Cruz)" autocomplete="name">
 <input class="field" id="lcd" placeholder="Code (hal. TR-XXXXX-XXXXX)" autocapitalize="characters" style="text-transform:uppercase">
 ${err?`<p style="color:var(--red);font-size:14px;margin:6px 0">Hindi tugma ang pangalan at code. I-check ang spelling.</p>`:""}
 <button class="btn" style="margin-top:8px" onclick="doActivate()">I-activate</button><button class="btn ghost" style="margin-top:12px" onclick="closeModal()">Isara</button>`)}
function doActivate(){const n=$("#lnm").value,c=$("#lcd").value;
 if(!checkCode(n,c)){const keep=[n,c];activateBox(true);$("#lnm").value=keep[0];$("#lcd").value=keep[1];return}
 S.lic={name:n.trim().replace(/\s+/g," ").toLowerCase().replace(/(^|[\s-])\S/g,m=>m.toUpperCase()),code:makeCode(n)};save();closeModal();beep("win");confetti();
 modal(`${tarsi("cheer",120,"pop")}<h2 style="margin:6px 0">Unlocked na lahat! 🎉</h2><p class="mut">Licensed to <b>${licName()}</b>.<br>Huwag ipamigay ang code mo. Nakapangalan ito sa iyo.</p><button class="btn" onclick="closeModal();home()">Tara, aral na!</button>`)}

/* ---------- BACKUP ---------- */
function backupBox(){let code="";try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){}
 modal(`${tarsi("neutral",90)}<h2 style="margin:6px 0">Backup ng progress</h2><p class="mut" style="font-size:14px">Kopyahin ang code na ito at i-save (hal. sa Notes). Gamitin sa ibang phone o browser para maibalik ang progress mo.</p>
  <textarea class="code" id="bk" readonly>${code}</textarea><button class="btn" style="margin-top:10px" onclick="copyCode()">Kopyahin</button>
  <h3 style="margin:16px 0 6px;text-align:left">I-restore</h3><textarea class="code" id="rs" placeholder="I-paste dito ang backup code"></textarea>
  <button class="btn amber" style="margin-top:10px" onclick="restoreCode()">I-restore</button><button class="btn ghost" style="margin-top:12px" onclick="closeModal()">Isara</button>`)}
function copyCode(){const t=$("#bk");t.select();let ok=false;try{navigator.clipboard.writeText(t.value).then(()=>{},()=>{});ok=true}catch(e){}try{ok=document.execCommand("copy")||ok}catch(e){}
 const b=event.target;b.textContent=ok?"Nakopya na ✓":"I-select at kopyahin nang manual"}
function restoreCode(){try{const d=JSON.parse(decodeURIComponent(escape(atob($("#rs").value.trim()))));if(typeof d!=="object"||d===null||!("xp" in d))throw 0;
 S=Object.assign(load(),d);save();closeModal();modal(`${tarsi("happy",110,"pop")}<h2 style="margin:6px 0">Naibalik na!</h2><p class="mut">${S.xp} XP · ${Object.keys(S.done).length} lessons</p><button class="btn" onclick="closeModal();home()">Ayos</button>`)}
 catch(e){$("#rs").style.borderColor="var(--red)";$("#rs").value="";$("#rs").placeholder="Mali ang code. Subukan ulit."}}

function resetAsk(){modal(`${tarsi("sad",100)}<h2 style="margin:6px 0">I-reset lahat?</h2><p class="mut">Mabubura ang XP, streak at progress.</p><button class="btn red" onclick="doReset()">I-reset</button><button class="btn ghost" style="margin-top:12px" onclick="closeModal()">Huwag</button>`)}
function doReset(){const lic=S.lic;S=load();S=Object.assign(S,{lic,onboarded:false,exam:null,goal:20,xp:0,streak:0,last:null,done:{},xpByDay:{},topic:{},best:{}});closeModal();ob={exam:null,goal:20};onboard(0)}
/* ---------- PROFILE TAB ---------- */
function profile(){const done=Object.keys(S.done).length;
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);const k=ymd(d);return {k,x:S.xpByDay[k]||0,l:"LMMHBSL"[d.getDay()===0?6:d.getDay()-1]}});
 const mx=Math.max(S.goal,...days.map(d=>d.x));
 const topics=Object.entries(S.topic).map(([t,v])=>[t,v.c/v.n,v.n]).sort((a,b)=>a[1]-b[1]).slice(0,8);
 app.innerHTML=topbar()+`<div class="page">
  <div class="prof"><div class="av"><img src="${IMG.head}" alt="" style="width:72px;margin-top:8px"></div><div><h2>Reviewer${S.exam?` · ${S.exam}`:''}</h2><div class="mut">Daily goal: ${S.goal} XP</div></div></div>
  <div class="grid2" style="margin-top:16px">
   <div class="mini">${IC.moon}<div><b>${streakAlive()}</b><small>araw na streak</small></div></div>
   <div class="mini">${IC.star}<div><b>${S.xp}</b><small>total XP</small></div></div>
   <div class="mini">${IC.book.replace(/#fff/g,'#0F6B4F')}<div><b>${done}</b><small>lessons tapos</small></div></div>
   <div class="mini">${IC.target}<div><b>${todayXP()}/${S.goal}</b><small>XP today</small></div></div></div>
  <div class="hcard"><h3>Ngayong linggo</h3><div class="week">${days.map((d,i)=>`<div><i class="${i===6?'today':''}" style="height:${d.x/mx*100}%"></i><span>${d.l}</span></div>`).join("")}</div></div>
  <div class="hcard"><h3>Mga topic na dapat i-review</h3>${topics.length?topics.map(([t,p,n])=>`<div class="tbar"><div class="l"><span>${t}</span><span class="mut">${Math.round(p*100)}%</span></div><div class="t"><i style="width:${p*100}%;background:${p<.5?'var(--red)':p<.75?'var(--a)':'var(--g)'}"></i></div></div>`).join(""):`<p class="mut">Sagutan muna ang isang lesson para makita dito.</p>`}</div>
  <div class="hcard"><div class="toggle"><span>Sound effects</span><button class="sw ${S.sound?'on':''}" onclick="S.sound=!S.sound;save();profile()"></button></div>
   <div class="toggle"><span>Palitan ang target exam / goal</span><button class="btn ghost" style="width:auto;padding:8px 14px;font-size:13px" onclick="ob={exam:S.exam,goal:S.goal};onboard(1)">Edit</button></div>
   <div class="toggle"><span>Backup / restore ng progress</span><button class="btn ghost" style="width:auto;padding:8px 14px;font-size:13px" onclick="backupBox()">Buksan</button></div>
   <div class="toggle"><span>I-reset ang progress</span><button class="btn ghost" style="width:auto;padding:8px 14px;font-size:13px;color:var(--red)" onclick="resetAsk()">Reset</button></div></div>
  <p class="legal">Tarsi Review · Independent practice material.<br>Not affiliated with UP, Ateneo, DLSU, UST, or CSC.</p>
 </div>`+navbar("profile")}

setInterval(()=>{document.querySelectorAll('img.tarsi').forEach(im=>{if(im.src===IMG.neutral){im.src=IMG.blink;setTimeout(()=>{if(im.src===IMG.blink)im.src=IMG.neutral},140)}})},3200);
go("home");
</script>
<script>if('serviceWorker' in navigator&&isSecureContext)navigator.serviceWorker.register('sw.js')</script>
</body>
</html>
